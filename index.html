<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TNV STARSHIP | Mine & Build</title>
    <style>
        :root { --neon: #00f2ff; --warn: #ffcc00; --danger: #ff0044; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD UI */
        .hud { position: absolute; z-index: 10; pointer-events: none; text-transform: uppercase; }
        #top-stats { top: 20px; left: 20px; display: flex; gap: 20px; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid var(--neon); }
        .stat-val { color: var(--neon); font-weight: bold; }

        #inventory { bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 2px solid #555; padding: 10px; display: flex; gap: 10px; }
        .slot { width: 50px; height: 50px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; }
        .slot.active { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }

        #build-menu { top: 20px; right: 20px; width: 180px; background: rgba(0,5,15,0.9); border: 1px solid var(--neon); padding: 10px; pointer-events: auto; }
        .nav-btn { display: block; color: var(--neon); text-decoration: none; font-size: 11px; margin: 5px 0; padding: 5px; border-bottom: 1px solid rgba(0,242,255,0.2); cursor: pointer; }
        .nav-btn:hover { background: var(--neon); color: black; }

        /* Mobile Controls */
        #mobile-ui { position: absolute; bottom: 30px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 20; pointer-events: none; }
        .m-btn { width: 70px; height: 70px; background: rgba(0,242,255,0.1); border: 2px solid var(--neon); border-radius: 50%; color: var(--neon); display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; }
        @media (pointer: coarse) { #mobile-ui { display: flex; } }

        #crosshair { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: var(--neon); opacity: 0.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair" class="hud">+</div>

    <div id="top-stats" class="hud">
        <div>HULL: <span id="hp" class="stat-val">100</span>%</div>
        <div>MATTER: <span id="matter" class="stat-val">0</span></div>
        <div>MODE: <span id="mode" class="stat-val">FLIGHT</span></div>
    </div>

    <div id="build-menu" class="hud">
        <div style="font-weight: bold; border-bottom: 1px solid var(--neon);">COMMAND_CONSOLE</div>
        <div class="nav-btn" onclick="toggleBuildMode()">TOGGLE BUILD [B]</div>
        <div class="nav-btn" onclick="warpTo(0,0,0)">WARP TO SPAWN</div>
        <div id="station-links"></div>
    </div>

    <div id="inventory" class="hud">
        <div class="slot active" id="slot-1">LASER</div>
        <div class="slot" id="slot-2">BUILD</div>
    </div>

    <div id="mobile-ui">
        <div class="m-btn" id="m-action">FIRE</div>
        <div class="m-btn" id="m-build">BUILD</div>
    </div>

    <script>
        // --- DATA & STATE ---
        const links = [
            { n: "YouTube", u: "https://www.youtube.com/terminatevader" },
            { n: "Discord", u: "https://discord.gg/DVNUcqe" },
            { n: "Store", u: "https://store.terminatevader.com/" }
        ];

        let state = {
            hp: 100,
            matter: 0,
            buildMode: false,
            inventory: 1,
            velocity: new THREE.Vector3(),
            rotation: new THREE.Euler(0, 0, 0, 'YXZ')
        };

        // --- ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0006);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const clock = new THREE.Clock();
        const loader = new THREE.TextureLoader();

        // --- WORLD GROUPS ---
        const asteroids = [];
        const lootItems = [];
        const builtObjects = [];
        const hazards = [];

        // --- PROCEDURAL GENERATION ---
        function initWorld() {
            // Stars
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(10000 * 3);
            for(let i=0; i<30000; i++) starPos[i] = (Math.random()-0.5)*8000;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1})));

            // Asteroid Field
            for(let i=0; i<300; i++) spawnAsteroid();

            // Hazards
            createHazard('BLACK HOLE', 0x000000, new THREE.Vector3(1500, 0, -1500), 100);
            createHazard('SUPERNOVA', 0xffaa00, new THREE.Vector3(-1500, 500, -500), 200);

            // TNV Stations
            links.forEach((link, i) => {
                const pos = new THREE.Vector3((i - 1) * 600, 0, -800);
                createStation(link, pos);
            });
        }

        function spawnAsteroid(pos) {
            const geo = new THREE.DodecahedronGeometry(5 + Math.random()*10, 0);
            const mat = new THREE.MeshStandardMaterial({color: 0x444444});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(
                pos ? pos.x : (Math.random()-0.5)*3000,
                pos ? pos.y : (Math.random()-0.5)*1500,
                pos ? pos.z : (Math.random()-0.5)*3000
            );
            scene.add(mesh);
            asteroids.push(mesh);
        }

        function createHazard(name, color, pos, size) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 32), new THREE.MeshBasicMaterial({color: color, wireframe: true}));
            mesh.position.copy(pos);
            scene.add(mesh);
            hazards.push({mesh, name, size});
        }

        function createStation(link, pos) {
            const geo = new THREE.BoxGeometry(60, 60, 60);
            const mat = new THREE.MeshStandardMaterial({color: 0x00f2ff, wireframe: true});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            const div = document.createElement('a');
            div.style.background = 'rgba(0,0,0,0.8)';
            div.style.border = '1px solid #00f2ff';
            div.style.color = '#00f2ff';
            div.style.padding = '5px';
            div.style.fontSize = '12px';
            div.href = link.u;
            div.target = "_blank";
            div.textContent = `[DOCK: ${link.n}]`;
            
            const label = new THREE.CSS2DObject(div);
            label.position.set(0, 50, 0);
            mesh.add(label);
            scene.add(mesh);

            const btn = document.createElement('div');
            btn.className = 'nav-btn';
            btn.textContent = `> FLY TO ${link.n}`;
            btn.onclick = () => warpTo(pos.x, pos.y, pos.z + 150);
            document.getElementById('station-links').appendChild(btn);
        }

        // --- MINING & LOOT ---
        function fire() {
            if(state.buildMode) { buildObject(); return; }
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            
            const intersects = raycaster.intersectObjects(asteroids);
            
            // Visual Laser
            const lGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1,-2), new THREE.Vector3(0,0,-100)]);
            const laserLine = new THREE.Line(lGeo, new THREE.LineBasicMaterial({color: 0x00f2ff}));
            camera.add(laserLine);
            setTimeout(() => camera.remove(laserLine), 50);

            if(intersects.length > 0) {
                const target = intersects[0].object;
                spawnLoot(target.position);
                scene.remove(target);
                asteroids.splice(asteroids.indexOf(target), 1);
            }
        }

        function spawnLoot(pos) {
            const loot = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            loot.position.copy(pos);
            scene.add(loot);
            lootItems.push(loot);
        }

        // --- BUILDING ---
        function toggleBuildMode() {
            state.buildMode = !state.buildMode;
            document.getElementById('mode').textContent = state.buildMode ? "BUILDING" : "FLIGHT";
            document.getElementById('slot-1').className = state.buildMode ? "slot" : "slot active";
            document.getElementById('slot-2').className = state.buildMode ? "slot active" : "slot";
            document.getElementById('m-action').textContent = state.buildMode ? "PLACE" : "FIRE";
        }

        function buildObject() {
            if(state.matter < 5) return;
            state.matter -= 5;
            updateHUD();

            const block = new THREE.Mesh(new THREE.BoxGeometry(10,10,10), new THREE.MeshStandardMaterial({color: 0x00f2ff, wireframe: true}));
            const spawnPos = new THREE.Vector3(0,0,-40);
            spawnPos.applyQuaternion(camera.quaternion);
            block.position.copy(camera.position).add(spawnPos);
            scene.add(block);
            builtObjects.push(block);
        }

        function warpTo(x,y,z) {
            camera.position.set(x,y,z);
            state.velocity.set(0,0,0);
        }

        // --- INPUTS ---
        const keys = {};
        window.onkeydown = (e) => {
            keys[e.key.toLowerCase()] = true;
            if(e.key === ' ') fire();
            if(e.key.toLowerCase() === 'b') toggleBuildMode();
        };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        document.getElementById('m-action').ontouchstart = (e) => { e.preventDefault(); fire(); };
        document.getElementById('m-build').ontouchstart = (e) => { e.preventDefault(); toggleBuildMode(); };

        document.body.onclick = () => { if(window.innerWidth > 1024) document.body.requestPointerLock(); };
        window.onmousemove = (e) => {
            if(document.pointerLockElement === document.body) {
                state.rotation.y -= e.movementX * 0.002;
                state.rotation.x -= e.movementY * 0.002;
            }
        };

        // --- MAIN LOOP ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const shipLight = new THREE.PointLight(0x00f2ff, 2, 500);
        scene.add(shipLight);

        function updateHUD() {
            document.getElementById('hp').textContent = Math.floor(state.hp);
            document.getElementById('matter').textContent = state.matter;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Movement
            const speed = keys['shift'] ? 300 : 100;
            if(keys['w']) state.velocity.z = -speed; else if(keys['s']) state.velocity.z = speed; else state.velocity.z = 0;
            if(keys['a']) state.velocity.x = -speed; else if(keys['d']) state.velocity.x = speed; else state.velocity.x = 0;
            
            camera.rotation.copy(state.rotation);
            camera.translateX(state.velocity.x * dt);
            camera.translateZ(state.velocity.z * dt);
            shipLight.position.copy(camera.position);

            // Loot collection
            for(let i=lootItems.length-1; i>=0; i--) {
                const item = lootItems[i];
                item.rotation.y += 0.05;
                if(camera.position.distanceTo(item.position) < 15) {
                    scene.remove(item);
                    lootItems.splice(i, 1);
                    state.matter += 10;
                    updateHUD();
                }
            }

            // Hazards (Gravitational Pull)
            hazards.forEach(h => {
                const dist = camera.position.distanceTo(h.mesh.position);
                if(dist < h.size * 5) {
                    const pull = new THREE.Vector3().subVectors(h.mesh.position, camera.position).normalize();
                    camera.position.add(pull.multiplyScalar((h.size / dist) * 2));
                    if(dist < h.size) state.hp -= 0.5;
                }
            });

            if(state.hp <= 0) { state.hp = 100; warpTo(0,0,0); alert("SHIP REBORN AT SPAWN"); }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        initWorld();
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
