<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TNV</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --trek: #00f2ff; --warn: #ffcc00; --deadly: #ff0044; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; color: white; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Cinematic HUD */
        .hud { position: absolute; z-index: 10; pointer-events: none; }
        #cockpit-frame { position: absolute; inset: 0; border: 20px solid rgba(255,255,255,0.03); pointer-events: none; z-index: 5; box-shadow: inset 0 0 100px rgba(0,0,0,0.8); }
        
        #stats { top: 30px; left: 30px; border-left: 2px solid var(--trek); padding: 15px; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); }
        .bar { width: 150px; height: 4px; background: #222; margin-top: 5px; }
        #shield-fill { height: 100%; background: var(--trek); transition: width 0.3s; }

        #comms { bottom: 30px; left: 30px; width: 300px; height: 100px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); padding: 10px; font-size: 10px; color: #aaa; overflow: hidden; }
        .msg { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }

        /* Controls */
        #joy-move { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; border: 2px solid var(--trek); border-radius: 50%; pointer-events: auto; }
        #joy-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--trek); border-radius: 50%; transform: translate(-50%,-50%); opacity: 0.5; }
        #btn-fire { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; border: 2px solid var(--deadly); border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--deadly); background: rgba(255,0,68,0.1); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="cockpit-frame"></div>

    <div id="stats" class="hud">
        <div style="font-size: 10px; opacity: 0.6;">SHIELDS</div>
        <div class="bar"><div id="shield-fill" style="width: 100%;"></div></div>
        <div style="margin-top: 15px; font-size: 18px;"><span id="matter-val">0</span> <small style="font-size: 9px;">MATTER</small></div>
    </div>

    <div id="comms" class="hud">
        <div class="msg" style="color:var(--trek)">[SYSTEM] Deep Space Sensors Active...</div>
    </div>

    <div id="btn-fire" class="hud">FIRE</div>
    <div id="joy-move" class="hud"><div id="joy-stick"></div></div>

    <script>
        // --- SHIP STATE & STORAGE ---
        let ship = {
            shields: 100,
            matter: parseInt(localStorage.getItem('tnv_matter')) || 0,
            pos: new THREE.Vector3(0, 0, 2000),
            rot: new THREE.Euler(0, 0, 0, 'YXZ'),
            input: { w:0, s:0, a:0, d:0, lookX:0, lookY:0 }
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 50000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- PROC-GEN ENTITIES ---
        const factions = [];
        const loader = new THREE.TextureLoader();
        const profileTex = loader.load('channels4_profile (3).jpg');

        function spawnFaction(type, pos) {
            const group = new THREE.Group();
            let body;
            if(type === 'BORG') {
                body = new THREE.Mesh(new THREE.BoxGeometry(200, 200, 200), new THREE.MeshStandardMaterial({color: 0x0a0a0a, emissive: 0x00ff44, emissiveIntensity: 0.5, wireframe: true}));
            } else {
                body = new THREE.Mesh(new THREE.ConeGeometry(50, 150, 4), new THREE.MeshStandardMaterial({color: 0x222222, emissive: 0xff0000}));
                body.rotation.x = Math.PI/2;
            }
            group.add(body);
            group.position.copy(pos);
            group.userData = { type, hp: 100, lastAction: 0 };
            scene.add(group);
            factions.push(group);
        }

        // Initialize World
        const sun = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 32), new THREE.MeshStandardMaterial({emissive: 0xffaa00, map: profileTex}));
        sun.position.set(0, 0, -8000);
        scene.add(sun);
        scene.add(new THREE.PointLight(0xffaa00, 3, 15000));
        scene.add(new THREE.AmbientLight(0xffffff, 0.1));

        spawnFaction('BORG', new THREE.Vector3(-3000, 500, -4000));
        spawnFaction('EMPIRE', new THREE.Vector3(3000, -500, -5000));

        // Background Starfield
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(15000 * 3);
        for(let i=0; i<45000; i++) starPos[i] = (Math.random()-0.5) * 30000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2})));

        // --- CONTROLS ---
        // Mouse Lock
        document.body.onclick = () => { if(window.innerWidth > 1024) document.body.requestPointerLock(); };
        document.addEventListener('mousemove', e => {
            if(document.pointerLockElement === document.body) {
                ship.rot.y -= e.movementX * 0.002;
                ship.rot.x -= e.movementY * 0.002;
            }
        });

        // Joystick for Mobile
        const joy = document.getElementById('joy-move');
        const stick = document.getElementById('joy-stick');
        let joyActive = false;
        joy.addEventListener('touchstart', () => joyActive = true);
        window.addEventListener('touchmove', e => {
            if(!joyActive) return;
            const t = e.touches[0];
            const r = joy.getBoundingClientRect();
            const x = (t.clientX - (r.left + 50)) / 50;
            const y = (t.clientY - (r.top + 50)) / 50;
            stick.style.transform = `translate(calc(-50% + ${x*25}px), calc(-50% + ${y*25}px))`;
            ship.input.w = y < -0.2 ? -y : 0;
            ship.input.s = y > 0.2 ? y : 0;
            ship.rot.y -= x * 0.05;
        });
        window.addEventListener('touchend', () => { joyActive = false; stick.style.transform='translate(-50%,-50%)'; ship.input.w=0; ship.input.s=0; });

        // Phasers
        function firePhasers() {
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(factions, true);
            
            // Visual Beam
            const beam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1000), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            beam.position.copy(camera.position).add(dir.multiplyScalar(500));
            beam.quaternion.copy(camera.quaternion);
            scene.add(beam);
            setTimeout(() => scene.remove(beam), 100);

            if(hits.length > 0) {
                const target = hits[0].object.parent || hits[0].object;
                target.userData.hp -= 10;
                addLog(`CRITICAL HIT on ${target.userData.type} entity`);
                if(target.userData.hp <= 0) {
                    addLog(`${target.userData.type} DESTROYED. +50 Matter`);
                    ship.matter += 50;
                    localStorage.setItem('tnv_matter', ship.matter);
                    target.position.set(20000,0,0); // Remove from field
                }
            }
        }
        document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); firePhasers(); });
        window.onkeydown = (e) => { if(e.key === ' ') firePhasers(); if(e.key === 'w') ship.input.w = 1; if(e.key === 's') ship.input.s = 1; };
        window.onkeyup = (e) => { if(e.key === 'w') ship.input.w = 0; if(e.key === 's') ship.input.s = 0; };

        // --- SYSTEMS ---
        function addLog(msg) {
            const c = document.getElementById('comms');
            c.innerHTML = `<div class="msg">${msg}</div>` + c.innerHTML;
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Ship movement
            camera.rotation.copy(ship.rot);
            const moveZ = (ship.input.s - ship.input.w) * 800 * dt;
            camera.translateZ(moveZ);

            // AI Logic
            factions.forEach(f => {
                const dist = f.position.distanceTo(camera.position);
                if(dist < 2500) {
                    f.lookAt(camera.position);
                    f.translateZ(150 * dt); // Chase player
                    if(dist < 400 && Math.random() > 0.98) {
                        ship.shields -= 1;
                        addLog("<span style='color:red'>[ALERT] SHIELDS UNDER ATTACK</span>");
                    }
                } else {
                    f.rotation.y += 0.2 * dt;
                }
            });

            // UI Updates
            document.getElementById('shield-fill').style.width = ship.shields + "%";
            document.getElementById('matter-val').textContent = ship.matter;
            if(ship.shields <= 0) { addLog("HULL BREACH. REBOOTING..."); setTimeout(()=>location.reload(), 2000); }

            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
